<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="m-title">
  <title id="m-title">Training pipeline: rollouts interleave task and memory actions, memory consolidation is scored by later retrieval, and the combined reward updates the policy.</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <linearGradient id="accentFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef0ff" />
      <stop offset="100%" stop-color="#e4e9ff" />
    </linearGradient>
  </defs>

  <rect width="1200" height="460" fill="#ffffff" />

  <text x="60" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#94a3b8">TRAINING LOOP</text>

  <!-- Stage 1 -->
  <rect x="60" y="150" width="230" height="150" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="84" y="188" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">01</text>
  <text x="84" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#334155">Interleaved rollout</text>
  <text x="84" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">task step, memory step,</text>
  <text x="84" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">task step, …</text>
  <text x="84" y="284" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">T = 128 steps</text>

  <line x1="290" y1="225" x2="340" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)" />

  <!-- Stage 2 -->
  <rect x="340" y="120" width="260" height="210" rx="16" fill="url(#accentFill)" stroke="#c7c9fb" />
  <text x="364" y="158" font-family="ui-monospace, monospace" font-size="12" fill="#818cf8">02</text>
  <text x="364" y="186" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#312e81">Policy samples actions</text>
  <rect x="364" y="202" width="212" height="30" rx="15" fill="#ffffff" stroke="#c7c9fb" />
  <text x="470" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#4338ca">a_t ~ π(· | o_t, M)</text>
  <rect x="364" y="240" width="212" height="30" rx="15" fill="#ffffff" stroke="#c7c9fb" />
  <text x="470" y="260" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#4338ca">m_t ~ π(· | o_t, M)</text>
  <text x="364" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6366f1">typed tool calls, logged</text>
  <text x="364" y="314" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6366f1">for credit assignment</text>

  <line x1="600" y1="225" x2="650" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)" />

  <!-- Stage 3 -->
  <rect x="650" y="110" width="250" height="230" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="674" y="148" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">03</text>
  <text x="674" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#334155">Consolidation scoring</text>
  <rect x="674" y="192" width="202" height="34" rx="8" fill="#e0f2fe" />
  <text x="690" y="214" font-family="ui-monospace, monospace" font-size="11" fill="#0369a1">replay retrieval probes</text>
  <rect x="674" y="234" width="202" height="34" rx="8" fill="#fef3c7" />
  <text x="690" y="256" font-family="ui-monospace, monospace" font-size="11" fill="#b45309">utility(entry, probe)</text>
  <rect x="674" y="276" width="202" height="34" rx="8" fill="#dcfce7" />
  <text x="690" y="298" font-family="ui-monospace, monospace" font-size="11" fill="#15803d">cost(entry) = tokens</text>
  <text x="674" y="328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">scored across episodes</text>

  <line x1="900" y1="225" x2="950" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow2)" />

  <!-- Stage 4 -->
  <rect x="950" y="140" width="200" height="170" rx="16" fill="#fff7ed" stroke="#fed7aa" />
  <text x="974" y="178" font-family="ui-monospace, monospace" font-size="12" fill="#fdba74">04</text>
  <text x="974" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Policy update</text>
  <text x="974" y="234" font-family="ui-monospace, monospace" font-size="11" fill="#c2410c">group-relative PG</text>
  <text x="974" y="256" font-family="ui-monospace, monospace" font-size="11" fill="#c2410c">advantage per memory</text>
  <text x="974" y="274" font-family="ui-monospace, monospace" font-size="11" fill="#c2410c">operation</text>
  <text x="974" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">no value network</text>

  <!-- feedback loop -->
  <path d="M 1050 140 C 1050 60 470 60 470 114" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow2)" />
  <text x="760" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c2410c">updated policy → next iteration</text>

  <!-- footer note -->
  <text x="60" y="418" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Memory state is reset between episodes; semantic memory persists across the batch.</text>
</svg>
