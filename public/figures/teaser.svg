<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t-title">
  <title id="t-title">RHM-Agent overview: an episode rolls out into a VLM policy that acts on the environment and manages working, episodic, and semantic memory, trained by a hierarchical reward.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="560" fill="#ffffff" />

  <!-- Episode -->
  <rect x="40" y="110" width="210" height="270" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="62" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">Episode</text>
  <rect x="62" y="162" width="166" height="58" rx="8" fill="#eef2f7" stroke="#dbe3ec" />
  <text x="78" y="196" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">frame t</text>
  <rect x="62" y="230" width="166" height="58" rx="8" fill="#eef2f7" stroke="#dbe3ec" />
  <text x="78" y="264" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">frame t-1</text>
  <rect x="62" y="298" width="166" height="58" rx="8" fill="#eef2f7" stroke="#dbe3ec" />
  <text x="78" y="332" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">frame t-2</text>

  <!-- Policy -->
  <rect x="320" y="120" width="240" height="215" rx="16" fill="#eef0ff" stroke="#c7c9fb" filter="url(#soft)" />
  <text x="440" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#312e81">VLM policy</text>
  <text x="440" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6366f1">one autoregressive model</text>
  <rect x="344" y="206" width="192" height="34" rx="17" fill="#ffffff" stroke="#c7c9fb" />
  <text x="440" y="228" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4338ca">task actions</text>
  <rect x="344" y="250" width="192" height="34" rx="17" fill="#ffffff" stroke="#c7c9fb" />
  <text x="440" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4338ca">memory actions</text>
  <rect x="344" y="294" width="192" height="26" rx="13" fill="#e0e7ff" />
  <text x="440" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4338ca">WRITE · COMPRESS · RETRIEVE · FORGET</text>

  <!-- Memory panel -->
  <rect x="640" y="76" width="330" height="350" rx="18" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="664" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">Hierarchical memory</text>

  <rect x="664" y="126" width="282" height="78" rx="12" fill="#e0f2fe" stroke="#bae6fd" />
  <text x="684" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369a1">Working</text>
  <text x="684" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0c4a6e">last k observations, verbatim</text>
  <text x="684" y="195" font-family="ui-monospace, monospace" font-size="11" fill="#0369a1">ring buffer · 4 slots</text>

  <rect x="664" y="216" width="282" height="78" rx="12" fill="#fef3c7" stroke="#fde68a" />
  <text x="684" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">Episodic</text>
  <text x="684" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78350f">one summary per episode</text>
  <text x="684" y="285" font-family="ui-monospace, monospace" font-size="11" fill="#b45309">key = goal, outcome</text>

  <rect x="664" y="306" width="282" height="96" rx="12" fill="#dcfce7" stroke="#bbf7d0" />
  <text x="684" y="334" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">Semantic</text>
  <text x="684" y="356" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#14532d">distilled facts, affordances, skills</text>
  <text x="684" y="375" font-family="ui-monospace, monospace" font-size="11" fill="#15803d">vector index over entries</text>
  <text x="684" y="393" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#166534">survives across tasks</text>

  <!-- Environment -->
  <rect x="40" y="430" width="520" height="64" rx="14" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="300" y="458" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">Environment · tools · rollout</text>
  <text x="300" y="478" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">long-horizon visual tasks with partial observability</text>

  <!-- Reward -->
  <rect x="640" y="452" width="520" height="60" rx="14" fill="#fff7ed" stroke="#fed7aa" />
  <text x="664" y="476" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c2410c">Hierarchical reward</text>
  <text x="664" y="496" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">r = task return + λ·retrieval utility − μ·memory cost</text>

  <!-- Arrows -->
  <line x1="250" y1="245" x2="314" y2="245" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="282" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">observe</text>

  <line x1="440" y1="335" x2="440" y2="424" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="452" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">act</text>

  <line x1="145" y1="430" x2="145" y2="386" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <line x1="560" y1="205" x2="634" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="597" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">memory ops</text>

  <line x1="634" y1="330" x2="560" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="597" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">retrieved context</text>

  <line x1="805" y1="426" x2="805" y2="446" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="817" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748b">credit</text>

  <path d="M 640 482 C 590 482 570 440 520 340" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="556" y="428" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#c2410c">policy update</text>
</svg>
