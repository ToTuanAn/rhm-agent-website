<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="r-title">
  <title id="r-title">Line chart of success rate against episode horizon for a VLM baseline, flat summary memory, and RHM-Agent; RHM-Agent stays highest as the horizon grows.</title>

  <rect width="1200" height="460" fill="#ffffff" />

  <text x="70" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">Success rate vs. episode horizon</text>
  <text x="70" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">VisualNav benchmark · placeholder data</text>

  <!-- Grid & axis -->
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="120" y1="80" x2="1120" y2="80" />
    <line x1="120" y1="155" x2="1120" y2="155" />
    <line x1="120" y1="230" x2="1120" y2="230" />
    <line x1="120" y1="305" x2="1120" y2="305" />
  </g>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" text-anchor="end">
    <text x="106" y="84">80</text>
    <text x="106" y="159">60</text>
    <text x="106" y="234">40</text>
    <text x="106" y="309">20</text>
    <text x="106" y="384">0</text>
  </g>
  <line x1="120" y1="380" x2="1120" y2="380" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- x labels -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="160" y="402">10</text>
    <text x="320" y="402">20</text>
    <text x="480" y="402">40</text>
    <text x="640" y="402">80</text>
    <text x="800" y="402">160</text>
    <text x="960" y="402">320</text>
  </g>
  <text x="620" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Episode horizon (steps)</text>

  <!-- Baseline -->
  <polyline points="160,185 320,200 480,222.5 640,245 800,267.5 960,290" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
  <g fill="#94a3b8">
    <circle cx="160" cy="185" r="3.5" /><circle cx="320" cy="200" r="3.5" /><circle cx="480" cy="222.5" r="3.5" />
    <circle cx="640" cy="245" r="3.5" /><circle cx="800" cy="267.5" r="3.5" /><circle cx="960" cy="290" r="3.5" />
  </g>

  <!-- Flat memory -->
  <polyline points="160,173.75 320,181.25 480,192.5 640,211.25 800,237.5 960,263.75" fill="none" stroke="#b45309" stroke-width="2" />
  <g fill="#b45309">
    <circle cx="160" cy="173.75" r="3.5" /><circle cx="320" cy="181.25" r="3.5" /><circle cx="480" cy="192.5" r="3.5" />
    <circle cx="640" cy="211.25" r="3.5" /><circle cx="800" cy="237.5" r="3.5" /><circle cx="960" cy="263.75" r="3.5" />
  </g>

  <!-- RHM-Agent -->
  <polyline points="160,162.5 320,147.5 480,132.5 640,117.5 800,110 960,106.25" fill="none" stroke="#4c46d6" stroke-width="2.6" />
  <g fill="#4c46d6">
    <circle cx="160" cy="162.5" r="4" /><circle cx="320" cy="147.5" r="4" /><circle cx="480" cy="132.5" r="4" />
    <circle cx="640" cy="117.5" r="4" /><circle cx="800" cy="110" r="4" /><circle cx="960" cy="106.25" r="4" />
  </g>

  <!-- Annotation -->
  <line x1="640" y1="117.5" x2="640" y2="80" stroke="#4c46d6" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="452" y="60" width="216" height="28" rx="14" fill="#eef0ff" />
  <text x="560" y="79" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4338ca">semantic reuse kicks in</text>

  <!-- Legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">
    <rect x="700" y="30" width="392" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
    <line x1="716" y1="50" x2="748" y2="50" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
    <text x="758" y="54">VLM baseline</text>
    <line x1="716" y1="72" x2="748" y2="72" stroke="#b45309" stroke-width="2" />
    <text x="758" y="76">+ flat summary memory</text>
    <line x1="716" y1="92" x2="748" y2="92" stroke="#4c46d6" stroke-width="2.6" />
    <text x="758" y="96" fill="#312e81" font-weight="600">RHM-Agent (ours)</text>
  </g>
</svg>
