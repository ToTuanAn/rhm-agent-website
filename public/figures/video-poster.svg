<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="v-title">
  <title id="v-title">Video poster for RHM-Agent, showing a hierarchy of working, episodic, and semantic memory.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12131f" />
      <stop offset="55%" stop-color="#1b1a3a" />
      <stop offset="100%" stop-color="#0d2a33" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c78ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7c78ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <ellipse cx="880" cy="180" rx="420" ry="300" fill="url(#glow)" />

  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200 M0 600 H1200" />
    <path d="M120 0 V675 M240 0 V675 M360 0 V675 M480 0 V675 M600 0 V675 M720 0 V675 M840 0 V675 M960 0 V675 M1080 0 V675" />
  </g>

  <text x="90" y="150" font-family="ui-monospace, monospace" font-size="16" letter-spacing="6" fill="#9a95ff">5-MINUTE OVERVIEW</text>

  <text x="90" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#ffffff">RHM-Agent</text>
  <text x="90" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#c7c9fb">
    Teaching VLMs to Reinforce Hierarchical Memory
  </text>

  <!-- memory tiers -->
  <g>
    <rect x="90" y="400" width="300" height="54" rx="12" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.5" />
    <text x="112" y="424" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#bae6fd">Working</text>
    <text x="112" y="443" font-family="ui-monospace, monospace" font-size="11" fill="#7dd3fc">current episode</text>

    <rect x="90" y="466" width="300" height="54" rx="12" fill="#f59e0b" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.5" />
    <text x="112" y="490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fde68a">Episodic</text>
    <text x="112" y="509" font-family="ui-monospace, monospace" font-size="11" fill="#fcd34d">compressed trajectories</text>

    <rect x="90" y="532" width="300" height="54" rx="12" fill="#22c55e" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.5" />
    <text x="112" y="556" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#bbf7d0">Semantic</text>
    <text x="112" y="575" font-family="ui-monospace, monospace" font-size="11" fill="#86efac">facts · skills · affordances</text>
  </g>

  <!-- reward formula -->
  <g opacity="0.9">
    <text x="470" y="440" font-family="ui-monospace, monospace" font-size="15" fill="#a5b4fc">r = task return</text>
    <text x="470" y="468" font-family="ui-monospace, monospace" font-size="15" fill="#a5b4fc">    + λ · retrieval utility</text>
    <text x="470" y="496" font-family="ui-monospace, monospace" font-size="15" fill="#a5b4fc">    − μ · memory cost</text>
  </g>
</svg>
